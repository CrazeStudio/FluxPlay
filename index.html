<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#0d0e14">

<title>Fluxplay 2.0</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"
>

<style>

:root{
--bg:#0d0e14;
--surface:#151620;
--variant:#1e1f2d;
--container:#191a26;
--primary:#a78bfa;
--primary2:#6366f1;
--accent:#f43f5e;
--text:#f3f4f6;
--subtle:#9ca3af;
--success:#34d399;
--error:#fb7185;
--warning:#fbbf24;
--outline:rgba(255,255,255,.08);

--rsm:10px;
--rmd:16px;
--rlg:24px;

--nav:68px;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
height:100dvh;
overflow:hidden;
background:var(--bg);
color:var(--text);
font-family:'Plus Jakarta Sans',sans-serif;
}

button,
input,
textarea,
select{
font:inherit;
color:inherit;
}

button{
cursor:pointer;
}

a{
color:inherit;
}

.app{
width:100%;
max-width:540px;
height:100dvh;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
background:var(--bg);
}

.topbar{
min-height:58px;
padding:env(safe-area-inset-top,10px) 15px 8px;
display:flex;
align-items:center;
justify-content:space-between;
flex-shrink:0;
}

.brand{
display:flex;
align-items:center;
gap:9px;
font-size:19px;
font-weight:800;
}

.logo{
width:33px;
height:33px;
border-radius:11px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,var(--primary),var(--accent));
color:#fff;
}

.status{
font-size:10px;
font-weight:700;
padding:5px 11px;
border-radius:999px;
border:1px solid var(--outline);
background:var(--container);
color:var(--subtle);
}

.status.live{
color:var(--success);
background:rgba(52,211,153,.08);
}

.status.error{
color:var(--error);
background:rgba(251,113,133,.08);
}

.status.warning{
color:var(--warning);
background:rgba(251,191,36,.08);
}

.content{
flex:1;
overflow-y:auto;
-webkit-overflow-scrolling:touch;
padding:5px 14px calc(var(--nav) + env(safe-area-inset-bottom,15px) + 20px);
}

.stack{
display:flex;
flex-direction:column;
gap:14px;
}

.card{
background:var(--surface);
border:1px solid var(--outline);
border-radius:var(--rmd);
padding:14px;
display:flex;
flex-direction:column;
gap:12px;
}

.label{
color:var(--primary);
font-size:11px;
font-weight:800;
text-transform:uppercase;
letter-spacing:.05em;
}

.input{
width:100%;
min-height:44px;
background:var(--container);
border:1px solid var(--outline);
border-radius:var(--rsm);
padding:11px 13px;
outline:none;
font-size:13px;
}

.input:focus{
border-color:var(--primary);
}

textarea.input{
min-height:100px;
resize:vertical;
font-family:'JetBrains Mono',monospace;
font-size:11px;
}

.btn{
min-height:44px;
border:0;
border-radius:999px;
padding:10px 15px;
display:flex;
align-items:center;
justify-content:center;
gap:7px;
background:linear-gradient(135deg,var(--primary),var(--primary2));
font-size:13px;
font-weight:800;
}

.btn.secondary{
background:var(--container);
border:1px solid var(--outline);
}

.btn.danger{
color:var(--error);
background:rgba(251,113,133,.12);
border:1px solid rgba(251,113,133,.25);
}

.btn:disabled{
opacity:.45;
cursor:not-allowed;
}

.row{
display:flex;
gap:8px;
}

.player{
width:100%;
aspect-ratio:16/9;
background:#000;
border-radius:var(--rmd);
overflow:hidden;
position:relative;
border:1px solid var(--outline);
box-shadow:0 10px 28px rgba(0,0,0,.5);
}

.player:fullscreen,
.player.fakefs{
position:fixed!important;
inset:0!important;
width:100vw!important;
height:100dvh!important;
border-radius:0!important;
z-index:999999!important;
}

.player video{
width:100%;
height:100%;
display:block;
object-fit:contain;
background:#000;
}

.player video::cue{
background:rgba(0,0,0,.8);
color:#fff;
font-family:'Plus Jakarta Sans',sans-serif;
}

.empty-player{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:6px;
color:var(--subtle);
pointer-events:none;
z-index:1;
font-size:12px;
}

.empty-player .material-symbols-rounded{
color:var(--primary);
font-size:36px;
}

.player.has-video .empty-player{
display:none;
}

.gestures{
position:absolute;
inset:0;
display:grid;
grid-template-columns:1fr 1fr;
z-index:3;
touch-action:none;
}

.gesture{
width:100%;
height:100%;
}

.player-ui{
position:absolute;
inset:0;
z-index:7;
padding:10px 12px;
display:flex;
flex-direction:column;
justify-content:space-between;
background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.08) 50%,rgba(0,0,0,.7));
transition:opacity .2s;
pointer-events:none;
}

.player-ui.hidden{
opacity:0;
}

.player-ui button,
.player-ui select,
.seek{
pointer-events:auto;
}

.player-top{
display:flex;
justify-content:flex-end;
gap:5px;
}

.speed{
height:34px;
background:rgba(255,255,255,.12);
border:1px solid var(--outline);
border-radius:var(--rsm);
padding:5px 7px;
font-size:11px;
}

.icon{
width:38px;
height:38px;
border:0;
border-radius:50%;
background:transparent;
display:inline-flex;
align-items:center;
justify-content:center;
color:#fff;
}

.icon.active{
color:var(--primary);
background:rgba(167,139,250,.15);
}

.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
display:flex;
align-items:center;
gap:15px;
}

.circle{
width:44px;
height:44px;
border-radius:50%;
border:1px solid rgba(255,255,255,.1);
background:rgba(30,31,45,.88);
display:flex;
align-items:center;
justify-content:center;
color:#fff;
}

.circle.play{
width:54px;
height:54px;
border:0;
background:linear-gradient(135deg,var(--primary),var(--primary2));
}

.bottom-controls{
display:flex;
flex-direction:column;
}

.seek{
height:30px;
position:relative;
display:flex;
align-items:center;
}

.seek-track{
width:100%;
height:5px;
background:rgba(255,255,255,.2);
border-radius:5px;
position:relative;
}

.seek-buffer,
.seek-fill{
position:absolute;
left:0;
top:0;
height:100%;
border-radius:5px;
}

.seek-buffer{
background:rgba(255,255,255,.35);
}

.seek-fill{
background:var(--primary);
}

.seek-thumb{
width:13px;
height:13px;
border-radius:50%;
background:#fff;
position:absolute;
transform:translateX(-50%);
}

.controls-row{
display:flex;
align-items:center;
justify-content:space-between;
}

.time{
font:11px 'JetBrains Mono',monospace;
color:#d1d5db;
}

.spinner{
position:absolute;
inset:0;
z-index:5;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.35);
pointer-events:none;
}

.spinner.hidden{
display:none;
}

.spinner-ring{
width:36px;
height:36px;
border:3px solid rgba(255,255,255,.15);
border-top-color:var(--primary);
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

.skip{
position:absolute;
top:0;
bottom:0;
width:40%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
color:#fff;
z-index:20;
opacity:0;
pointer-events:none;
transition:opacity .15s;
font-size:12px;
font-weight:800;
}

.skip.show{
opacity:1;
}

.skip.left{
left:0;
}

.skip.right{
right:0;
}

/* METADATA */

.provider-tabs{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.provider-tab{
padding:7px 12px;
border-radius:999px;
background:var(--container);
border:1px solid var(--outline);
color:var(--subtle);
font-size:11px;
font-weight:800;
cursor:pointer;
transition:all 0.2s;
user-select:none;
}

.provider-tab.active{
background:rgba(167,139,250,.15);
border-color:var(--primary);
color:var(--primary);
}

.search-row{
display:flex;
gap:8px;
}

.search-row .input{
flex:1;
}

.result-list{
display:flex;
flex-direction:column;
gap:8px;
}

.result{
width:100%;
display:flex;
gap:10px;
padding:9px;
background:var(--container);
border:1px solid var(--outline);
border-radius:13px;
text-align:left;
}

.result-poster{
width:58px;
height:82px;
object-fit:cover;
border-radius:8px;
background:var(--variant);
flex-shrink:0;
}

.result-info{
min-width:0;
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
gap:4px;
}

.result-title{
font-size:13px;
font-weight:800;
line-height:1.3;
}

.result-meta{
font-size:10px;
color:var(--subtle);
}

.result-rating{
font-size:11px;
color:var(--warning);
font-weight:800;
}

.details{
display:flex;
gap:12px;
}

.details-poster{
width:120px;
height:175px;
object-fit:cover;
border-radius:12px;
background:var(--variant);
flex-shrink:0;
}

.details-info{
min-width:0;
display:flex;
flex-direction:column;
gap:6px;
}

.details-title{
font-size:18px;
font-weight:800;
line-height:1.25;
}

.details-meta{
font-size:10px;
color:var(--subtle);
}

.rating{
color:var(--warning);
font-size:14px;
font-weight:800;
}

.genres{
display:flex;
flex-wrap:wrap;
gap:5px;
}

.genre{
padding:4px 7px;
border-radius:999px;
background:var(--variant);
border:1px solid var(--outline);
color:var(--subtle);
font-size:9px;
}

.plot{
font-size:11px;
line-height:1.55;
color:#d1d5db;
}

.cast{
display:flex;
flex-wrap:wrap;
gap:5px;
}

.cast-item{
padding:5px 8px;
background:var(--container);
border:1px solid var(--outline);
border-radius:999px;
font-size:9px;
}

.source{
font-size:9px;
color:var(--subtle);
}

.source b{
color:var(--primary);
}

.open-source{
text-decoration:none;
display:flex;
align-items:center;
justify-content:center;
min-height:40px;
border-radius:999px;
background:var(--container);
border:1px solid var(--outline);
font-size:11px;
font-weight:800;
}

/* Horizontal scrolling sections for Home Feed */
.horizontal-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 8px;
  scroll-snap-type: x mandatory;
}
.horizontal-scroll::-webkit-scrollbar {
  display: none;
}
.horizontal-card {
  flex-shrink: 0;
  width: 110px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
  background: none;
  border: 0;
  scroll-snap-align: start;
}
.horizontal-poster {
  width: 110px;
  height: 160px;
  border-radius: 10px;
  object-fit: cover;
  background: var(--variant);
}
.horizontal-title {
  font-size: 11px;
  font-weight: 800;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.horizontal-meta {
  font-size: 9px;
  color: var(--subtle);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}

.media{
overflow:hidden;
background:var(--container);
border:1px solid var(--outline);
border-radius:14px;
}

.poster{
width:100%;
aspect-ratio:2/3;
object-fit:cover;
background:var(--variant);
}

.media-body{
padding:9px;
}

.media-title{
font-size:12px;
font-weight:800;
line-height:1.35;
}

.media-meta{
color:var(--subtle);
font-size:9px;
margin-top:4px;
}

.media-actions{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:5px;
}

.setting{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
min-height:50px;
border-bottom:1px solid var(--outline);
}

.setting:last-child{
border-bottom:0;
}

.setting-text{
display:flex;
flex-direction:column;
gap:3px;
}

.setting-text strong{
font-size:12px;
}

.setting-text small{
color:var(--subtle);
font-size:10px;
}

.empty{
text-align:center;
color:var(--subtle);
font-size:12px;
padding:25px 10px;
}

.archive{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
padding:10px;
background:var(--container);
border:1px solid var(--outline);
border-radius:11px;
}

.archive-info{
min-width:0;
flex:1;
}

.archive-name{
font-size:11px;
font-weight:800;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.archive-meta{
font-size:9px;
color:var(--subtle);
margin-top:3px;
}

.nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:540px;
min-height:var(--nav);
padding-bottom:env(safe-area-inset-bottom,0);
background:rgba(25,26,38,.96);
backdrop-filter:blur(14px);
border-top:1px solid var(--outline);
display:flex;
z-index:100;
}

.nav-btn{
flex:1;
border:0;
background:none;
color:var(--subtle);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:2px;
font-size:9px;
font-weight:700;
}

.nav-btn.active{
color:var(--text);
}

.nav-btn.active .material-symbols-rounded{
color:var(--primary);
background:rgba(167,139,250,.16);
border-radius:999px;
}

.nav-btn .material-symbols-rounded{
font-size:22px;
padding:3px 12px;
}

@media(max-width:380px){
.row{
flex-direction:column;
}
.grid{
grid-template-columns:1fr;
}
.details{
flex-direction:column;
}
.details-poster{
width:140px;
height:205px;
}
.search-row{
flex-direction:column;
}
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
<div class="brand">
<div class="logo">
<span class="material-symbols-rounded">play_arrow</span>
</div>
Fluxplay
</div>
<div id="status" class="status">Ready</div>
</header>

<main id="content" class="content"></main>

<nav class="nav">
<button class="nav-btn active" data-page="player">
<span class="material-symbols-rounded">play_circle</span>
Player
</button>
<button class="nav-btn" data-page="metadata">
<span class="material-symbols-rounded">movie_filter</span>
Discover
</button>
<button class="nav-btn" data-page="history">
<span class="material-symbols-rounded">history</span>
History
</button>
<button class="nav-btn" data-page="bookmarks">
<span class="material-symbols-rounded">bookmark</span>
Saved
</button>
<button class="nav-btn" data-page="settings">
<span class="material-symbols-rounded">settings</span>
Settings
</button>
</nav>

</div>

<script>
"use strict";

/* =========================================================
STORAGE
========================================================= */

const STORE={
history:"fluxplay_v2_history",
bookmarks:"fluxplay_v2_bookmarks",
settings:"fluxplay_v2_settings",
metadata:"fluxplay_v2_metadata"
};

function load(key,fallback){
try{
const raw=localStorage.getItem(key);
return raw?JSON.parse(raw):fallback;
}catch{
return fallback;
}
}

function save(key,value){
try{
localStorage.setItem(key,JSON.stringify(value));
}catch{}
}

let history=load(STORE.history,[]);
let bookmarks=load(STORE.bookmarks,[]);
let metadataCache=load(STORE.metadata,{});
let settings=load(STORE.settings,{
theme:"dark",
primary:"#a78bfa",
accent:"#f43f5e",
tmdbKey:"",
lbxUsername:"",
lbxClientId:"",
lbxClientSecret:""
});

let currentPage="player";
let currentMedia=null;
let currentUrl="";

/* =========================================================
DOM
========================================================= */

const content=document.getElementById("content");
const status=document.getElementById("status");

function setStatus(text,type=""){
status.textContent=text;
status.className="status "+type;
}

function escapeHTML(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function formatSynopsis(text) {
  if (!text) return "";
  let str = String(text).replace(/<br\s*\/?>/gi, "\n");
  const div = document.createElement("div");
  div.innerHTML = str;
  str = div.textContent || div.innerText || "";
  return escapeHTML(str.trim()).replace(/\n/g, "<br>");
}

function formatTime(seconds){
if(!Number.isFinite(seconds) || seconds<0) return "0:00";
return Math.floor(seconds/60)+":"+String(Math.floor(seconds%60)).padStart(2,"0");
}

function formatBytes(bytes){
if(!Number.isFinite(bytes) || bytes<=0) return "0 B";
const units=["B","KB","MB","GB","TB"];
const i=Math.min(Math.floor(Math.log(bytes)/Math.log(1024)),units.length-1);
return (bytes/Math.pow(1024,i)).toFixed(i?1:0)+" "+units[i];
}

function filenameFromURL(url){
try{
const u=new URL(url);
let name=decodeURIComponent(u.pathname.split("/").pop()||"");
if(name.length > 40){
  name = name.substring(0, 37) + "...";
}
return name||"Video";
}catch{
return "Video";
}
}

/* =========================================================
THEME
========================================================= */

function applyTheme(){
document.documentElement.style.setProperty("--primary",settings.primary);
document.documentElement.style.setProperty("--accent",settings.accent);

if(settings.theme==="light"){
document.documentElement.style.setProperty("--bg","#f5f5f7");
document.documentElement.style.setProperty("--surface","#ffffff");
document.documentElement.style.setProperty("--container","#eeeef4");
document.documentElement.style.setProperty("--variant","#e5e7eb");
document.documentElement.style.setProperty("--text","#111827");
document.documentElement.style.setProperty("--subtle","#6b7280");
}else{
document.documentElement.style.setProperty("--bg","#0d0e14");
document.documentElement.style.setProperty("--surface","#151620");
document.documentElement.style.setProperty("--container","#191a26");
document.documentElement.style.setProperty("--variant","#1e1f2d");
document.documentElement.style.setProperty("--text","#f3f4f6");
document.documentElement.style.setProperty("--subtle","#9ca3af");
}
save(STORE.settings,settings);
}
applyTheme();

/* =========================================================
HISTORY & BOOKMARK
========================================================= */

function addHistory(media){
if(!media?.url) return;
history=history.filter(x=>x.url!==media.url);
history=[{...media,watchedAt:Date.now()},...history].slice(0,100);
save(STORE.history,history);
}

function updateProgress(url,time,duration){
history=history.map(item=>item.url===url?{...item,progress:time,duration:duration,watchedAt:Date.now()}:item);
save(STORE.history,history);
}

function isBookmarked(url){
return bookmarks.some(x=>x.url===url);
}

function toggleBookmark(media){
if(!media?.url) return;
if(isBookmarked(media.url)){
bookmarks=bookmarks.filter(x=>x.url!==media.url);
}else{
bookmarks=[{...media,bookmarkedAt:Date.now()},...bookmarks];
}
save(STORE.bookmarks,bookmarks);
}

function mediaFromURL(url){
const old=history.find(x=>x.url===url);
if(old) return old;
const saved=bookmarks.find(x=>x.url===url);
if(saved) return saved;
return{
url:url,
title:filenameFromURL(url),
type:"Video",
poster:"",year:"",rating:"",source:"Direct",progress:0,duration:0
};
}

/* =========================================================
PLAYER
========================================================= */

function renderPlayer(){
content.innerHTML=`
<div class="stack">
<div class="player" id="player">
<video id="video" playsinline webkit-playsinline preload="metadata"></video>
<div class="gestures">
<div class="gesture" id="leftGesture"></div>
<div class="gesture" id="rightGesture"></div>
</div>

function initPlayer(){
const video=document.getElementById("video");
const player=document.getElementById("player");
const streamURL=document.getElementById("streamURL");
const streamButton=document.getElementById("streamButton");
const playButton=document.getElementById("playButton");
const playIcon=document.getElementById("playIcon");
const back10=document.getElementById("back10");
const forward10=document.getElementById("forward10");

const fullscreenButton=document.getElementById("fullscreenButton");

const fill=document.getElementById("fill");

const thumb=document.getElementById("thumb");
const time=document.getElementById("time");
const spinner=document.getElementById("spinner");
const playerUI=document.getElementById("playerUI");
const left=document.getElementById("leftGesture");
const right=document.getElementById("rightGesture");
const skipLeft=document.getElementById("skipLeft");
const skipRight=document.getElementById("skipRight");
const bookmarkButton=document.getElementById("bookmarkButton");
const seekableButton=document.getElementById("seekableButton");
const bufferStatus=document.getElementById("bufferStatus");

let uiTimer=null;
let lastLeftTap=0;
let lastRightTap=0;
let pendingResume=false;
let currentBlobUrl=null;
let downloadAbort=null;

function guessMime(url){
const ext=(url.split("?")[0].split(".").pop()||"").toLowerCase();
const map={mp4:"video/mp4",m4v:"video/mp4",webm:"video/webm",mov:"video/quicktime",ogv:"video/ogg",mkv:"video/x-matroska"};
return map[ext]||"video/mp4";
}

function resetBlobPlayback(){
if(downloadAbort){downloadAbort.abort();downloadAbort=null;}
if(currentBlobUrl){URL.revokeObjectURL(currentBlobUrl);currentBlobUrl=null;}
}

function showUI(){
playerUI.classList.remove("hidden");
clearTimeout(uiTimer);
uiTimer=setTimeout(()=>{if(!video.paused) playerUI.classList.add("hidden");},3000);
}

function playSource(url){
url=String(url||"").trim();
if(!url) return;
resetBlobPlayback();
if(bufferStatus){bufferStatus.style.display="none";}
currentUrl=url;
currentMedia=mediaFromURL(url);
addHistory(currentMedia);
streamURL.value=url;
player.classList.add("has-video");
spinner.classList.remove("hidden");
setStatus("Loading...");
pendingResume=true;
video.src=url;
video.load();
updatePlayerMediaInfo();
video.play().catch(()=>{spinner.classList.add("hidden");setStatus("Ready");});
}

// Attach globally so it can be called from discover pages
window.playTrailer = function(url){
  currentPage="player";
  setActiveNav();
  renderPlayer();
  setTimeout(()=>{
    playSource(url);
  }, 50);
}

streamButton.onclick=()=>playSource(streamURL.value);
streamURL.onkeydown=e=>{if(e.key==="Enter"){playSource(streamURL.value);streamURL.blur();}};

async function bufferForSeeking(url){
url=String(url||"").trim();
if(!url){alert("Load a video first.");return;}
resetBlobPlayback();
downloadAbort=new AbortController();
const resumeAt=video.src?(video.currentTime||0):0;
seekableButton.disabled=true;
bufferStatus.style.display="block";
bufferStatus.textContent="Downloading 0 MB...";
setStatus("Buffering full video...","warning");
spinner.classList.remove("hidden");
try{
const response=await fetch(url,{signal:downloadAbort.signal});
if(!response.ok || !response.body) throw new Error("HTTP "+response.status);
const total=Number(response.headers.get("Content-Length"))||0;
const reader=response.body.getReader();
const chunks=[];
let received=0;
while(true){
const chunk=await reader.read();
if(chunk.done) break;
chunks.push(chunk.value);
received+=chunk.value.length;
const mb=(received/1048576).toFixed(1);
bufferStatus.textContent=total?
`Downloading ${mb} MB / ${(total/1048576).toFixed(1)} MB (${Math.round(received/total*100)}%)`:
`Downloading ${mb} MB...`;
}
const mime=response.headers.get("Content-Type")||guessMime(url);
const blob=new Blob(chunks,{type:mime.split(";")[0]});
currentBlobUrl=URL.createObjectURL(blob);
currentUrl=url;
player.classList.add("has-video");
pendingResume=false;
video.src=currentBlobUrl;
video.load();
video.addEventListener("loadedmetadata",function resumeOnce(){
try{video.currentTime=Math.min(resumeAt,Math.max(0,video.duration-0.5));}catch{}
video.removeEventListener("loadedmetadata",resumeOnce);
},{once:true});
video.play().catch(()=>{});
setStatus("Playing (buffered)","live");
bufferStatus.textContent="Fully buffered — seeking now works normally.";
setTimeout(()=>{if(bufferStatus) bufferStatus.style.display="none";},4000);
}catch(error){
spinner.classList.add("hidden");
if(error.name==="AbortError") return;
setStatus("Buffer Failed","error");
bufferStatus.textContent="Couldn't download this source directly (it may block cross-origin access): "+error.message;
}finally{
seekableButton.disabled=false;
}
}

seekableButton.onclick=()=>bufferForSeeking(currentUrl||streamURL.value.trim());

function togglePlay(){
if(!video.src) return;
if(video.paused) video.play().catch(()=>{}); else video.pause();
showUI();
}

playButton.onclick=togglePlay;

function showSkip(element){
element.classList.remove("show");
void element.offsetWidth;
element.classList.add("show");
setTimeout(()=>element.classList.remove("show"),500);
}

function skip(seconds){
if(!video.src) return;
let target=video.currentTime+seconds;
target=Math.max(0,target);
if(Number.isFinite(video.duration)) target=Math.min(video.duration,target);
video.currentTime=target;
showSkip(seconds<0?skipLeft:skipRight);
showUI();
}

back10.onclick=()=>skip(-10);
forward10.onclick=()=>skip(10);

function handleDoubleTap(side){
const now=performance.now();
const last=side==="left"?lastLeftTap:lastRightTap;
if(now-last<300){
if(side==="left") lastLeftTap=0; else lastRightTap=0;
skip(side==="left"?-10:10);
return;
}
if(side==="left") lastLeftTap=now; else lastRightTap=now;
setTimeout(()=>{
const latest=side==="left"?lastLeftTap:lastRightTap;
if(latest===now) playerUI.classList.toggle("hidden");
},300);
}

left.addEventListener("pointerup",e=>{e.preventDefault();handleDoubleTap("left");},{passive:false});
right.addEventListener("pointerup",e=>{e.preventDefault();handleDoubleTap("right");},{passive:false});

function updateSeek(){
const duration=video.duration;
if(!Number.isFinite(duration) || duration<=0) return;
const percent=Math.max(0,Math.min(100,video.currentTime/duration*100));
fill.style.width=percent+"%";
thumb.style.left=percent+"%";
time.textContent=formatTime(video.currentTime)+" / "+formatTime(duration);
if(video.buffered.length){
try{
const end=video.buffered.end(video.buffered.length-1);
buffer.style.width=Math.min(100,end/duration*100)+"%";
}catch{}
}
if(currentUrl) updateProgress(currentUrl,video.currentTime,duration);
}

seek.addEventListener("pointerdown",e=>{
e.preventDefault();
const rect=seek.getBoundingClientRect();
const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
if(Number.isFinite(video.duration)){
video.currentTime=pct*video.duration;
}
showUI();
},{passive:false});

muteButton.onclick=()=>{
video.muted=!video.muted;
muteButton.innerHTML=`<span class="material-symbols-rounded">${video.muted?"volume_off":"volume_up"}</span>`;
showUI();
};

speed.onchange=()=>{video.playbackRate=Number(speed.value)||1;};

async function enterFullscreen(){
try{
if(document.fullscreenElement){await document.exitFullscreen();return;}
if(player.requestFullscreen) await player.requestFullscreen();
else player.classList.add("fakefs");
}catch{player.classList.add("fakefs");}

document.addEventListener("fullscreenchange",()=>{
fullscreenButton.innerHTML=`<span class="material-symbols-rounded">${document.fullscreenElement?"fullscreen_exit":"fullscreen"}</span>`;
if(!document.fullscreenElement) player.classList.remove("fakefs");

video.addEventListener("play",()=>{playIcon.textContent="pause";setStatus("Playing","live");spinner.classList.add("hidden");showUI();});
video.addEventListener("pause",()=>{playIcon.textContent="play_arrow";setStatus("Paused");showUI();});
video.addEventListener("timeupdate",updateSeek);
video.addEventListener("loadedmetadata",()=>{
spinner.classList.add("hidden");
if(pendingResume && currentMedia?.progress){
try{video.currentTime=Math.min(currentMedia.progress,video.duration-1);}catch{}
}
pendingResume=false;
updateSeek();
});
video.addEventListener("waiting",()=>{spinner.classList.remove("hidden");});
video.addEventListener("playing",()=>{spinner.classList.add("hidden");});
video.addEventListener("error",()=>{spinner.classList.add("hidden");setStatus("Video Error","error");});

bookmarkButton.onclick=()=>{
if(!currentMedia) return;
toggleBookmark(currentMedia);
updatePlayerMediaInfo();
};

async function fetchJSON(url,options={}){
const response=await fetch(url,{...options,headers:{"Accept":"application/json",...(options.headers||{})}});
if(!response.ok) throw new Error("HTTP "+response.status);
return response.json();
}

function findCachedMetadata(provider, id) {
  for (const key in metadataCache) {
    const val = metadataCache[key];
    if (Array.isArray(val)) {
      const found = val.find(x => String(x.id) === String(id) && x.provider === provider);
      if (found) return found;
    } else if (val && String(val.id) === String(id) && val.provider === provider) {
      return val;
    }
  }
  return null;
}

LETTERBOXD INTEGRATIONS (API + RSS)

// RSS Data Source (Public)
async function letterboxdRSS() {
  const username = settings.lbxUsername;
  if (!username) return [];
  const cacheKey = "lbx-rss-" + username;
  if(metadataCache[cacheKey]) return metadataCache[cacheKey];
  
  try {
    const rssUrl = `https://letterboxd.com/${username}/rss/`;
    // We use allorigins.win because it's a solid free proxy to bypass CORS for public XML
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
    const res = await fetch(proxyUrl);
    const data = await res.json();
    const parser = new DOMParser();
    const xml = parser.parseFromString(data.contents, "text/xml");
    const items = Array.from(xml.querySelectorAll("item")).slice(0, 15);
    
    const results = items.map(item => {
      let title = item.querySelector("title")?.textContent || "";
      let year = "";
      
      title = title.replace(/^Watched /, "");
      const yearMatch = title.match(/, (\d{4})/);
      if (yearMatch) year = yearMatch[1];
      title = title.split(/, \d{4}/)[0].trim();
      
      let poster = "";
      const desc = item.querySelector("description")?.textContent || "";
      const imgMatch = desc.match(/<img[^>]+src="([^">]+)"/);
      if (imgMatch) poster = imgMatch[1];
      
      return {
        id: "lbx-rss-" + Math.random().toString(36).substring(7),
        provider: "Letterboxd",
        source: "Letterboxd RSS",
        title: title,
        year: year,
        type: "Activity",
        rating: "",
        poster: poster,
        synopsis: stripHTML(desc),
        url: item.querySelector("link")?.textContent || ""
      };
    });
    
    metadataCache[cacheKey] = results;
    save(STORE.metadata, metadataCache);
    return results;
  } catch(e) { return []; }
}

// Official API Search Source (Private / Requires Keys)
async function letterboxdSearch(query) {
  const cid = settings.lbxClientId;
  const csec = settings.lbxClientSecret;
  if (!cid || !csec) return []; // Gracefully fail if keys aren't provided
  
  try {
    // Proxy is strictly required since api.letterboxd.com enforces strict browser CORS
    const proxy = "https://corsproxy.io/?"; 
    
    // 1. Fetch OAuth Token
    let token = metadataCache["lbx-token"];
    if (!token) {
      const authRes = await fetch(proxy + encodeURIComponent("https://api.letterboxd.com/api/v0/auth/token"), {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
          "Accept": "application/json"
        },
        body: new URLSearchParams({
          grant_type: "client_credentials",
          client_id: cid,
          client_secret: csec
        })
      });
      if (!authRes.ok) throw new Error("Auth Failed");
      const authData = await authRes.json();
      token = authData.access_token;
      metadataCache["lbx-token"] = token;
      save(STORE.metadata, metadataCache);
    }
    
    // 2. Perform /v0/search
    const searchUrl = proxy + encodeURIComponent(`https://api.letterboxd.com/api/v0/search?input=${encodeURIComponent(query)}&perPage=12`);
    const res = await fetch(searchUrl, {
      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/json"
      }
    });
    if (!res.ok) throw new Error("Search Failed");
    
    const json = await res.json();
    const items = json.items || [];
    
    return items.map(item => {
      const film = item.film || item; // Standardize depending on v0 payload
      let poster = "";
      if (film.poster && film.poster.sizes && film.poster.sizes.length > 0) {
        poster = film.poster.sizes[0].url;
      }
      return {
        id: film.id || film.lid || "lbx-" + Math.random(),
        provider: "Letterboxd",
        source: "Letterboxd API",
        title: film.name || film.title || "Unknown",
        year: film.releaseYear || "",
        type: "Movie",
        rating: "",
        poster: poster,
        synopsis: "", // Search endpoints don't typically include full synopsis
        url: film.links ? film.links.find(l => l.type === 'letterboxd')?.url : ""
      };
    });
  } catch (e) {
    return []; 
  }
}

function getTMDBKey() {

  return {
    id: item.id,
    provider: "TMDB",
    source: "TMDB",

async function tmdbNowPlaying() {
  const key = getTMDBKey();
  if(!key) return [];
  const url = `https://api.themoviedb.org/3/movie/now_playing?api_key=${key}&language=en-US&page=1`;
  try {
    const json = await fetchJSON(url);
    return (json.results || []).map(formatTmdbItem);
  } catch(e) { return []; }
}

async function tmdbSearch(query) {
  const key = getTMDBKey();
  if(!key) return [];
  const url = `https://api.themoviedb.org/3/search/movie?api_key=${key}&language=en-US&query=${encodeURIComponent(query)}&page=1`;
  try {
    const json = await fetchJSON(url);
    return (json.results || []).map(formatTmdbItem);
  } catch(e) { return []; }
}

async function tmdbDetails(id) {
  const key = getTMDBKey();
  if(!key) throw new Error("TMDB API Key missing");
  const url = `https://api.themoviedb.org/3/movie/${id}?api_key=${key}&language=en-US&append_to_response=credits,videos`;
  const json = await fetchJSON(url);
  
  let trailerUrl = "";
  if (json.videos && json.videos.results) {
    const trailer = json.videos.results.find(v => v.type === "Trailer" && v.site === "YouTube");
    if (trailer) trailerUrl = "https://www.youtube.com/watch?v=" + trailer.key;
  }
  
  return {
    id: json.id,
    provider: "TMDB",
    source: "TMDB",
    title: json.title || "Unknown",
    year: json.release_date ? json.release_date.substring(0,4) : "",
    type: "Movie",
    rating: json.vote_average ? json.vote_average.toFixed(1) : "",
    poster: json.poster_path ? `https://image.tmdb.org/t/p/w500${json.poster_path}` : "",
    synopsis: json.overview || "",
    duration: json.runtime ? json.runtime + "m" : "",
    genres: (json.genres || []).map(g => g.name),
    sourceURL: json.homepage || `https://www.themoviedb.org/movie/${json.id}`,
    url: trailerUrl,
    characters: json.credits?.cast?.slice(0, 12).map(c => c.name) || []
  };
}

async function itunesSearch(query) {
  const cacheKey = "itunes-search-" + query.toLowerCase();
  if(metadataCache[cacheKey]) return metadataCache[cacheKey];
  const url = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=movie&limit=12`;
  try {
    const json = await fetchJSON(url);
    const results = (json.results || []).map(formatItunesItem);
    metadataCache[cacheKey] = results;
    save(STORE.metadata, metadataCache);
    return results;
  } catch(e) { return []; }
}

async function itunesTopMovies() {
  const cacheKey = "itunes-top-movies";
  if(metadataCache[cacheKey]) return metadataCache[cacheKey];
  const url = "https://itunes.apple.com/us/rss/topmovies/limit=15/json";
  try {
    const json = await fetchJSON(url);
    const entries = json.feed?.entry || [];
    const results = entries.map(item => {
      const id = item.id?.attributes?.["im:id"] || "";
      let poster = item["im:image"]?.[2]?.label || "";
      poster = poster.replace("113x170", "600x600");
      return {
        id: id,
        provider: "iTunes",
        source: "iTunes",
        title: item["im:name"]?.label || "Unknown",
        year: item["im:releaseDate"]?.attributes?.label?.substring(0,4) || "",
        type: "Movie",
        rating: "",
        poster: poster,
        synopsis: item.summary?.label || "",
        duration: "",
        genres: [item.category?.attributes?.label].filter(Boolean),
        sourceURL: item.link?.[0]?.attributes?.href || "",
        url: ""
      };
    });
    metadataCache[cacheKey] = results;
    save(STORE.metadata, metadataCache);
    return results;
  } catch(e) { return []; }
}

async function itunesDetails(id) {
  const url = `https://itunes.apple.com/lookup?id=${id}`;
  const json = await fetchJSON(url);
  if(!json.results || !json.results.length) throw new Error("Not found");
  return formatItunesItem(json.results[0]);
}

async function anilistRequest(query,variables){
const response=await fetch("https://graphql.anilist.co",{
method:"POST",
headers:{"Content-Type":"application/json","Accept":"application/json"},
body:JSON.stringify({query,variables})
});
if(!response.ok) throw new Error("AniList HTTP "+response.status);
const json=await response.json();
if(json.errors?.length) throw new Error(json.errors[0].message||"AniList error");
return json.data;
}

      studios { nodes { name } } characters(sort: ROLE, perPage: 8) { nodes { name { full } } }
    }
  }
}
`;

const ANILIST_DETAILS = `
query($id: Int) {
  Media(id: $id, type: ANIME) {
    id idMal title { romaji english native } type format status description(asHtml: false)
    startDate { year } episodes duration averageScore popularity genres
    coverImage { large extraLarge } siteUrl
    studios { nodes { name } } characters(sort: ROLE, perPage: 12) { nodes { name { full } } }
  }
}
`;

function formatAnilistItem(item) {
  return {
    id: item.id,
    malId: item.idMal,
    provider: "AniList",
    source: "AniList",
    title: item.title.english || item.title.romaji || item.title.native || "Unknown",
    nativeTitle: item.title.native || "",
    year: item.startDate?.year || "",
    type: item.format || item.type || "Anime",
    rating: item.averageScore ? (item.averageScore/10).toFixed(1) : "",
    poster: item.coverImage?.extraLarge || item.coverImage?.large || "",
    synopsis: item.description || "",
    episodes: item.episodes || "",
    duration: item.duration || "",
    status: item.status || "",
    genres: item.genres || [],
    studios: item.studios?.nodes?.map(x=>x.name) || [],
    sourceURL: item.siteUrl || "",
    characters: item.characters?.nodes?.map(x=>x.name.full) || []
  };
}

async function anilistSearch(query){
  const cacheKey="anilist-search-"+query.toLowerCase();
  if(metadataCache[cacheKey]) return metadataCache[cacheKey];
  try {
    const data = await anilistRequest(ANILIST_SEARCH,{search:query});
    const results = data.Page.media.map(formatAnilistItem);
    metadataCache[cacheKey] = results;
    save(STORE.metadata, metadataCache);
    return results;
  } catch (e) { return []; }
}

async function anilistTrending() {
  const cacheKey = "anilist-trending";
  if(metadataCache[cacheKey]) return metadataCache[cacheKey];
  try {
    const data = await anilistRequest(ANILIST_TRENDING, {});
    const results = data.Page.media.map(formatAnilistItem);
    metadataCache[cacheKey] = results;
    save(STORE.metadata, metadataCache);
    return results;
  } catch(e) { return []; }
}

async function anilistDetails(id) {
  const data = await anilistRequest(ANILIST_DETAILS, { id: Number(id) });
  return formatAnilistItem(data.Media);
}

function stripHTML(html){
const div=document.createElement("div");
div.innerHTML=html||"";
return div.textContent||div.innerText||"";
}

function formatTvmazeItem(show) {
  return {
    id: show.id,
    provider: "TVmaze",
    source: "TVmaze",
    title: show.name || "Unknown",
    year: show.premiered ? show.premiered.slice(0,4) : "",
    type: "TV",
    rating: show.rating?.average || "",
    poster: show.image?.original || show.image?.medium || "",
    synopsis: show.summary || "",
    duration: show.averageRuntime || "",
    status: show.status || "",
    genres: show.genres || [],
    sourceURL: show.url || "",
    characters: (show._embedded?.cast || []).slice(0,12).map(x=>x.person?.name).filter(Boolean)
  };
}

async function tvmazeSearch(query){
  const cacheKey="tvmaze-search-"+query.toLowerCase();
  if(metadataCache[cacheKey]) return metadataCache[cacheKey];
  try {
    const json=await fetchJSON("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(query));
    const results=json.slice(0,12).map(item=>formatTvmazeItem(item.show));
    metadataCache[cacheKey]=results;
    save(STORE.metadata,metadataCache);
    return results;
  } catch(e) { return []; }
}

async function tvmazePopular() {
  const cacheKey = "tvmaze-popular";
  if(metadataCache[cacheKey]) return metadataCache[cacheKey];
  try {
    const json = await fetchJSON("https://api.tvmaze.com/shows");
    const results = json.slice(0, 15).map(formatTvmazeItem);
    metadataCache[cacheKey] = results;
    save(STORE.metadata, metadataCache);
    return results;
  } catch(e) { return []; }
}

async function tvmazeDetails(id){
  const json=await fetchJSON("https://api.tvmaze.com/shows/"+id+"?embed[]=cast");
  return formatTvmazeItem(json);
}

async function loadHomeFeed() {
  const box = document.getElementById("metadataResults");
  box.innerHTML = `<div class="empty">Loading trending media...</div>`;
  
  try {
    const promises = [
      itunesTopMovies(),
      anilistTrending(),
      tvmazePopular()
    ];
    
    if (getTMDBKey()) promises.unshift(tmdbNowPlaying());
    if (settings.lbxUsername) promises.unshift(letterboxdRSS());
    
    const results = await Promise.all(promises);
    let html = "";
    
    if (settings.lbxUsername) {
      const lbxData = results.shift(); 
      if(lbxData.length) html += renderHorizontalSection(`Letterboxd: @${escapeHTML(settings.lbxUsername)}'s Activity`, lbxData);
    }
    
    if (getTMDBKey()) {
      const tmdbData = results.shift(); 
      if(tmdbData.length) html += renderHorizontalSection("Now Playing in Theaters (TMDB)", tmdbData);
    } else {
      html += `
        <div class="card" style="padding:10px; margin-bottom:-5px;">
          <div class="label">Now Playing in Theaters</div>
          <div class="empty" style="padding:5px; font-size:11px;">
            To see real-time theatrical movies (like Spider-Man),<br>
            add a free TMDB API Key in <b>Settings</b>.
          </div>
        </div>
      `;
    }
    
    const [movies, anime, tv] = results; 
    
    if(movies.length) html += renderHorizontalSection("Top Digital Movies (iTunes)", movies);
    if(anime.length) html += renderHorizontalSection("Trending Anime", anime);
    if(tv.length) html += renderHorizontalSection("Popular TV Shows", tv);
    
    box.innerHTML = html;
    bindResultClicks(box);
  } catch (error) {
    box.innerHTML = `<div class="empty">Failed to load home feed.</div>`;
  }
}

function renderHorizontalSection(title, items) {
  return `
    <div class="card" style="padding:10px 0; background:transparent; border:0; margin-bottom:-10px;">
      <div class="label" style="padding:0 14px 10px;">${escapeHTML(title)}</div>
      <div class="horizontal-scroll" style="padding:0 14px 10px;">
        ${items.map(item => `

            </div>

          </button>
        `).join("")}

    </div>
  `;
}

async function runUnifiedSearch(){
  const query=document.getElementById("metadataSearch").value.trim();
  const box=document.getElementById("metadataResults");
  document.getElementById("metadataDetails").innerHTML="";
  
  if(!query) { loadHomeFeed(); return; }
  
  box.innerHTML=`<div class="empty">Searching...</div>`;
  
  const searchMovies=document.getElementById("searchMovies").checked;
  const searchAnime=document.getElementById("searchAnime").checked;
  const searchTv=document.getElementById("searchTv").checked;
  const searchLbx=document.getElementById("searchLetterboxd").checked;
  
  if(!searchMovies && !searchAnime && !searchTv && !searchLbx) {
    box.innerHTML=`<div class="empty">Please select at least one source to search.</div>`;
    return;
  }
  
  try {
    const promises = [];
    
    if(searchMovies) {
      if (getTMDBKey()) promises.push(tmdbSearch(query));
      else promises.push(itunesSearch(query));
    }
    
    if(searchLbx) promises.push(letterboxdSearch(query));
    if(searchAnime) promises.push(anilistSearch(query));
    if(searchTv) promises.push(tvmazeSearch(query));
    
    const resultsArrays = await Promise.all(promises);
    const allResults = resultsArrays.flat();
    
    if(!allResults.length){
      box.innerHTML=`<div class="empty">No results found for "${escapeHTML(query)}". Check that your API keys in Settings are valid.</div>`;
      return;
    }
    
    box.innerHTML=`
      <div class="card" style="background:transparent; border:0; padding:0;">
        <div class="result-list">
          ${allResults.map(renderResult).join("")}
        </div>
      </div>
    `;
    bindResultClicks(box);
    
  } catch(error) {
    box.innerHTML=`<div class="empty">Search failed. Try again later.</div>`;
  }
}

function renderResult(item){
return `

<div class="result-meta">${escapeHTML(item.source||item.provider)}</div>

function bindResultClicks(container) {

    button.onclick = () => {

async function loadMetadataDetails(provider,id){
const box=document.getElementById("metadataDetails");
box.innerHTML=`<div class="card"><div class="empty">Loading details...</div></div>`;
try{
  let data;
  const cached = findCachedMetadata(provider, id);
  
  if(provider==="TMDB") {
    data=await tmdbDetails(id);
  } else if(cached && (cached.synopsis || provider==="Letterboxd")) {
    data = cached;
  } else {
    if(provider==="AniList") data=await anilistDetails(id);
    else if(provider==="TVmaze") data=await tvmazeDetails(id);
    else if(provider==="iTunes") data=await itunesDetails(id);
  }
  
  renderMetadataDetails(data);
}catch(error){
  box.innerHTML=`<div class="card"><div class="empty">${escapeHTML(error.message)}</div></div>`;
}
}

function exportData(){
const data={app:"Fluxplay",version:"2.0",createdAt:Date.now(),history,bookmarks,metadataCache,settings};
const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
saveAs(blob,"Fluxplay_2_Backup.json");
}

function importData(file){
const reader=new FileReader();
reader.onload=()=>{
try{
const data=JSON.parse(reader.result);
if(!Array.isArray(data.history)||!Array.isArray(data.bookmarks)) throw new Error("Invalid backup");
history=data.history;bookmarks=data.bookmarks;
metadataCache=data.metadataCache||{};settings=data.settings||settings;
save(STORE.history,history);save(STORE.bookmarks,bookmarks);save(STORE.metadata,metadataCache);save(STORE.settings,settings);
applyTheme();
alert("Backup restored successfully.");
renderSettings();
}catch{alert("Invalid Fluxplay backup.");}
};
reader.readAsText(file);
}

/* =========================================================
NAVIGATION
========================================================= */
function setActiveNav(){
document.querySelectorAll(".nav-btn").forEach(button=>{
button.classList.toggle("active",button.dataset.page===currentPage);
});
}

document.querySelectorAll(".nav-btn").forEach(button=>{
button.onclick=()=>{
currentPage=button.dataset.page;
setActiveNav();
if(currentPage==="player") renderPlayer();
else if(currentPage==="metadata") renderDiscover();
else if(currentPage==="history") renderHistory();
else if(currentPage==="bookmarks") renderBookmarks();
else if(currentPage==="settings") renderSettings();
};
});

/* =========================================================
START
========================================================= */
renderPlayer();
</script>
</body>
</html>
